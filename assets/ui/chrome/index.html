<!doctype html>
<html lang="en" data-theme="light" data-palette="mizu" data-density="comfortable" data-style="soft">
<head>
  <meta charset="utf-8">
  <title>Mizu</title>
  <link rel="stylesheet" href="/_/tokens.css">
  <link rel="stylesheet" href="chrome.css">
</head>
<body>
  <div id="app">
    <header id="tabstrip">
      <div id="private-badge" hidden></div>
      <div id="tabs" role="tablist"></div>
      <button id="new-tab" class="icon-btn" title="New tab (Ctrl+T)"></button>
      <div class="drag-fill"></div>
      <div id="toast" role="status" aria-live="polite"></div>
      <div id="caption">
        <button id="cap-min" title="Minimize"></button>
        <button id="cap-max" title="Maximize"></button>
        <button id="cap-close" title="Close"></button>
      </div>
    </header>
    <nav id="toolbar">
      <button id="back" class="icon-btn" title="Back (Alt+Left)"></button>
      <button id="forward" class="icon-btn" title="Forward (Alt+Right)"></button>
      <button id="reload" class="icon-btn" title="Reload (Ctrl+R)"></button>
      <button id="home" class="icon-btn" title="Home (Alt+Home)" hidden></button>
      <div id="omnibox">
        <button id="site" title="Site information"></button>
        <input id="address" type="text" spellcheck="false" autocomplete="off" aria-label="Address and search bar">
        <span id="zoom-badge" hidden></span>
        <button id="ext-install" class="omni-btn install" title="Install this extension in Mizu" hidden></button>
        <button id="star" class="omni-btn" title="Bookmark this page (Ctrl+D)"></button>
        <button id="shield-btn" class="omni-btn" title="Mizu Shield"><span id="shield-count"></span></button>
        <div id="progress"></div>
      </div>
      <button id="downloads" class="icon-btn" title="Downloads (Ctrl+J)" hidden>
        <svg id="dl-ring" viewBox="0 0 36 36"><circle cx="18" cy="18" r="15.5"/></svg>
      </button>
      <button id="menu" class="icon-btn" title="Menu"></button>
    </nav>
    <div id="bookmarks" hidden></div>
  </div>
  <script src="/_/bridge.js"></script>
  <script src="/_/theme.js"></script>
  <script src="/_/icons.js"></script>
  <script src="chrome.js"></script>
</body>
</html>
